<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradientes de Fondo -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#130f26" />
      <stop offset="100%" stop-color="#0a0812" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5a2e98" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#130f26" stop-opacity="0" />
    </radialGradient>

    <!-- Gradientes de las Etiquetas (Colores Vibrantes) -->
    <linearGradient id="grad-protein" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b000ff" />
      <stop offset="100%" stop-color="#00d4ff" />
    </linearGradient>
    <linearGradient id="grad-creatine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#60efff" />
    </linearGradient>
    <linearGradient id="grad-pre" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ffb700" />
    </linearGradient>
    
    <!-- Gradiente para el Plástico Oscuro (Cuerpo del bote) -->
    <linearGradient id="plastic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1a1a" />
      <stop offset="20%" stop-color="#3d3d3d" />
      <stop offset="50%" stop-color="#111111" />
      <stop offset="80%" stop-color="#2a2a2a" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    
    <linearGradient id="lid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#444" />
      <stop offset="100%" stop-color="#000" />
    </linearGradient>
  </defs>

  <!-- ==================== FONDO Y EFECTOS ==================== -->
  <rect width="100%" height="100%" fill="url(#bg)" />
  <circle cx="400" cy="320" r="350" fill="url(#glow)" />

  <!-- Líneas de Acción y Partículas (Estilo Anime/Cómic) -->
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.4">
    <line x1="80" y1="80" x2="180" y2="180" stroke-width="4" stroke="#00d4ff" />
    <line x1="720" y1="120" x2="620" y2="220" stroke-width="3" stroke="#00ff87" />
    <line x1="120" y1="520" x2="220" y2="450" stroke-width="5" stroke="#ff0055" />
    <line x1="680" y1="480" x2="580" y2="420" stroke-width="4" stroke="#ffb700" />
    
    <!-- Destellos -->
    <circle cx="220" cy="120" r="8" fill="#ffb700" stroke="none" opacity="0.9" />
    <circle cx="650" cy="250" r="12" fill="#00ff87" stroke="none" opacity="0.8" />
    <circle cx="150" cy="350" r="6" fill="#00d4ff" stroke="none" opacity="0.9" />
    <circle cx="580" cy="100" r="10" fill="#b000ff" stroke="none" opacity="0.7" />
  </g>
  
  <!-- Sombra Base Global -->
  <ellipse cx="400" cy="530" rx="300" ry="25" fill="#000000" opacity="0.7" />

  <!-- ==================== 1. BOTE DE CREATINA (Derecha - Inclinado) ==================== -->
  <g transform="translate(490, 280) rotate(10)">
    <!-- Sombra del bote -->
    <ellipse cx="90" cy="220" rx="80" ry="15" fill="#000" opacity="0.6" />
    
    <!-- Cuerpo (Forma Cilíndrica 3D) -->
    <path d="M 10,30 L 10,210 A 80,12 0 0,0 170,210 L 170,30 A 80,12 0 0,1 10,30 Z" fill="url(#plastic)" />
    
    <!-- Etiqueta -->
    <path d="M 10,70 L 10,180 A 80,12 0 0,0 170,180 L 170,70 A 80,12 0 0,1 10,70 Z" fill="url(#grad-creatine)" />
    
    <!-- Brillo del cilindro -->
    <path d="M 20,72 L 20,178 A 70,10 0 0,0 40,180 L 40,70 A 70,10 0 0,1 20,72 Z" fill="#ffffff" opacity="0.4" />
    
    <!-- Textos Creatina -->
    <text x="90" y="115" fill="#000000" font-family="&#39;Impact&#39;, &#39;Arial Black&#39;, sans-serif" font-size="28" text-anchor="middle" font-style="italic" transform="skewX(-5)">CREATINA</text>
    <text x="90" y="140" fill="#0a0812" font-family="Arial, sans-serif" font-weight="900" font-size="12" text-anchor="middle">FUERZA PURA • 5G</text>
    
    <!-- Gráfico geométrico en la etiqueta -->
    <polygon points="50,150 130,150 90,170" fill="#000000" opacity="0.7" />

    <!-- Tapa -->
    <path d="M 0,10 L 0,30 A 90,12 0 0,0 180,30 L 180,10 A 90,12 0 0,1 0,10 Z" fill="url(#lid)" />
    <ellipse cx="90" cy="10" rx="90" ry="12" fill="#222" />
    <!-- Textura de la tapa -->
    <rect x="25" y="12" width="6" height="18" fill="#111" rx="2" />
    <rect x="60" y="15" width="6" height="18" fill="#111" rx="2" />
    <rect x="90" y="16" width="6" height="18" fill="#111" rx="2" />
    <rect x="120" y="15" width="6" height="18" fill="#111" rx="2" />
    <rect x="155" y="12" width="6" height="18" fill="#111" rx="2" />
  </g>

  <!-- ==================== 2. BOTE DE PRE-ENTRENO (Izquierda - Inclinado) ==================== -->
  <g transform="translate(130, 310) rotate(-12)">
    <!-- Sombra del bote -->
    <ellipse cx="75" cy="190" rx="60" ry="10" fill="#000" opacity="0.6" />
    
    <!-- Cuerpo -->
    <path d="M 15,25 L 15,180 A 60,10 0 0,0 135,180 L 135,25 A 60,10 0 0,1 15,25 Z" fill="url(#plastic)" />
    
    <!-- Etiqueta -->
    <path d="M 15,60 L 15,150 A 60,10 0 0,0 135,150 L 135,60 A 60,10 0 0,1 15,60 Z" fill="url(#grad-pre)" />
    
    <!-- Brillo -->
    <path d="M 25,62 L 25,148 A 50,8 0 0,0 35,149 L 35,61 A 50,8 0 0,1 25,62 Z" fill="#ffffff" opacity="0.4" />
    
    <!-- Icono Rayo Explosivo -->
    <polygon points="75,60 50,100 65,100 60,135 95,85 80,85" fill="#ffffff" filter="drop-shadow(0px 0px 5px #ffb700)" />
    
    <!-- Textos Pre-Entreno -->
    <text x="75" y="150" fill="#ffffff" font-family="&#39;Impact&#39;, &#39;Arial Black&#39;, sans-serif" font-size="18" text-anchor="middle" font-style="italic">PRE-ENTRENO</text>

    <!-- Tapa -->
    <path d="M 5,8 L 5,25 A 70,10 0 0,0 145,25 L 145,8 A 70,10 0 0,1 5,8 Z" fill="url(#lid)" />
    <ellipse cx="75" cy="8" rx="70" ry="10" fill="#222" />
    <rect x="25" y="10" width="5" height="15" fill="#111" rx="1" />
    <rect x="55" y="12" width="5" height="15" fill="#111" rx="1" />
    <rect x="90" y="12" width="5" height="15" fill="#111" rx="1" />
    <rect x="120" y="10" width="5" height="15" fill="#111" rx="1" />
  </g>

  <!-- ==================== 3. BOTE DE PROTEÍNA (Centro - Imponente) ==================== -->
  <g transform="translate(290, 140)">
    <!-- Sombra del bote -->
    <ellipse cx="110" cy="370" rx="110" ry="20" fill="#000" opacity="0.8" />
    
    <!-- Cuerpo -->
    <path d="M 10,40 L 10,350 A 100,18 0 0,0 210,350 L 210,40 A 100,18 0 0,1 10,40 Z" fill="url(#plastic)" />
    
    <!-- Etiqueta -->
    <path d="M 10,100 L 10,300 A 100,18 0 0,0 210,300 L 210,100 A 100,18 0 0,1 10,100 Z" fill="url(#grad-protein)" />
    
    <!-- Diseño dinámico en la etiqueta (Cortes diagonales) -->
    <polygon points="10,220 210,160 210,300 10,300" fill="#000000" opacity="0.4" />
    <polygon points="10,250 210,190 210,300 10,300" fill="#000000" opacity="0.6" />

    <!-- Brillo curvo del cilindro -->
    <path d="M 25,103 L 25,297 A 85,15 0 0,0 45,299 L 45,101 A 85,15 0 0,1 25,103 Z" fill="#ffffff" opacity="0.3" />
    
    <!-- Textos Principales -->
    <text x="110" y="165" fill="#ffffff" font-family="&#39;Impact&#39;, &#39;Arial Black&#39;, sans-serif" font-size="52" text-anchor="middle" font-style="italic" transform="skewX(-8)">WHEY</text>
    <text x="110" y="205" fill="#00d4ff" font-family="&#39;Impact&#39;, &#39;Arial Black&#39;, sans-serif" font-size="28" text-anchor="middle" letter-spacing="2" transform="skewX(-8)">PROTEÍNA</text>
    
    <!-- Escudo / Sello de calidad -->
    <g transform="translate(110, 255)">
      <path d="M-30,-25 L30,-25 L35,10 C35,25 0,45 0,45 C0,45 -35,25 -35,10 Z" fill="#00d4ff" />
      <text x="0" y="0" fill="#130f26" font-family="Arial, sans-serif" font-weight="900" font-size="18" text-anchor="middle">100%</text>
      <text x="0" y="15" fill="#130f26" font-family="Arial, sans-serif" font-weight="bold" font-size="10" text-anchor="middle">ISOLATADA</text>
    </g>

    <!-- Tapa Gigante -->
    <path d="M 0,15 L 0,45 A 110,18 0 0,0 220,45 L 220,15 A 110,18 0 0,1 0,15 Z" fill="url(#lid)" />
    <ellipse cx="110" cy="15" rx="110" ry="18" fill="#1a1a1a" />
    
    <!-- Relieves de la tapa -->
    <rect x="20" y="20" width="8" height="25" fill="#111" rx="3" />
    <rect x="50" y="24" width="8" height="25" fill="#111" rx="3" />
    <rect x="80" y="26" width="8" height="25" fill="#111" rx="3" />
    <rect x="110" y="27" width="8" height="25" fill="#111" rx="3" />
    <rect x="140" y="26" width="8" height="25" fill="#111" rx="3" />
    <rect x="170" y="24" width="8" height="25" fill="#111" rx="3" />
    <rect x="200" y="20" width="8" height="25" fill="#111" rx="3" />
  </g>
</svg>